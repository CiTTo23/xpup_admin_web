<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>XP-Up Admin | Login</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- CSS propio -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="login-page theme-classic">

  <main class="container min-vh-100 d-flex align-items-center justify-content-center">
    <section class="card login-card shadow-lg">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="login-logo mb-3">
            XP
          </div>

          <h1 class="h3 fw-bold mb-1">XP-Up Admin</h1>
          <p class="text-muted mb-0">Panel de administración</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="identificador" class="form-label">Usuario o email</label>
            <input
              type="text"
              class="form-control"
              id="identificador"
              placeholder="david_admin"
              autocomplete="username"
              required
            />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Password@123"
              autocomplete="current-password"
              required
            />
          </div>

          <button id="loginButton" type="submit" class="btn btn-primary w-100">
            Entrar al panel
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          Acceso exclusivo para administradores
        </p>

      </div>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS propio -->
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
