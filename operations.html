<!-- Página del histórico de operaciones administrativas -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>XP-Up Admin | Operaciones</title>

  <!-- Bootstrap para estilos y componentes responsivos -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Estilos propios del panel -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="theme-classic">

  <div class="admin-wrapper">

    <!-- Menú lateral renderizado desde JavaScript -->
    <aside id="sidebar" class="sidebar"></aside>

    <div class="admin-content">

      <!-- Barra superior renderizada desde JavaScript -->
      <header id="topbar" class="topbar"></header>

      <main class="admin-main">

        <!-- Mensaje de error para operaciones -->
        <div id="operationsAlert" class="alert alert-danger d-none" role="alert"></div>

        <section class="card table-card mb-4">
          <div class="card-body">

            <div class="admin-section-header mb-4">
              <div class="admin-section-title">
                <h2 class="h5 mb-1">Histórico de operaciones</h2>
                <p class="text-muted mb-0">
                  Consulta de acciones realizadas desde el panel de administración.
                </p>
              </div>

              <!-- Formulario de filtros -->
              <form id="operationsFilterForm" class="admin-filter-form">
                <div class="filter-field">
                  <label for="operationTypeInput" class="form-label small">Tipo operación</label>
                  <input
                    type="text"
                    id="operationTypeInput"
                    class="form-control form-control-sm"
                    placeholder="ELIMINAR_PUBLICACION"
                  />
                </div>

                <div class="filter-field-small">
                  <label for="operationEntitySelect" class="form-label small">Entidad</label>
                  <select id="operationEntitySelect" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option value="USUARIO">USUARIO</option>
                    <option value="PUBLICACION">PUBLICACION</option>
                    <option value="COMENTARIO">COMENTARIO</option>
                  </select>
                </div>

                <div class="filter-field-small">
                  <label for="operationAdminIdInput" class="form-label small">Admin ID</label>
                  <input
                    type="number"
                    id="operationAdminIdInput"
                    class="form-control form-control-sm"
                    placeholder="ID"
                    min="1"
                  />
                </div>

                <div class="filter-actions">
                  <button type="submit" class="btn btn-primary btn-sm">
                    Filtrar
                  </button>

                  <button type="button" id="clearOperationFiltersButton" class="btn btn-outline-secondary btn-sm">
                    Limpiar
                  </button>
                </div>
              </form>
            </div>

            <!-- Tabla principal de operaciones -->
            <div class="table-responsive">
              <table class="table table-hover align-middle xpup-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Operación</th>
                    <th>Entidad</th>
                    <th>Admin</th>
                    <th>Detalle</th>
                    <th>Fecha</th>
                    <th class="text-end">Acciones</th>
                  </tr>
                </thead>

                <tbody id="operationsTableBody">
                  <tr>
                    <td colspan="7" class="text-center text-muted py-4">
                      Cargando operaciones...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Controles de paginación -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mt-3">
              <p id="operationsPaginationInfo" class="text-muted mb-0 small">
                -
              </p>

              <div class="d-flex gap-2">
                <button id="prevOperationsPageButton" class="btn btn-outline-warning btn-sm">
                  Anterior
                </button>

                <button id="nextOperationsPageButton" class="btn btn-outline-warning btn-sm">
                  Siguiente
                </button>
              </div>
            </div>

          </div>
        </section>

      </main>

    </div>

  </div>

  <!-- Modal detalle operación -->
  <div class="modal fade" id="operationDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content xpup-modal">
        <div class="modal-header">
          <h5 class="modal-title">Detalle de operación</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div id="operationDetailContent" class="d-grid gap-3">
            Cargando...
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dependencias y scripts del panel -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/operations.js"></script>
</body>
</html>
